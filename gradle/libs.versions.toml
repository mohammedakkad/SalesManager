[versions]
agp                   = "9.5.2"
kotlin                = "2.4.21"
ksp                   = "2.3.14"
coreKtx               = "1.18.0"
lifecycle             = "2.10.0"
activityCompose       = "1.13.0"
composeBom            = "2026.06.01"
navigationCompose     = "2.9.8"
room                  = "2.8.5"
koin                  = "4.2.2"
koinCompose           = "4.2.2"
coroutines            = "1.11.0"
firebaseBom           = "35.2.0"
googleServices        = "4.6.0"
crashlyticsPlugin     = "3.0.8"
datastore             = "1.3.0"
workmanager = "2.12.0"
mlkit-barcode = "17.3.0"
camera2 = "1.7.0"
okhttp = "5.4.0"
gson = "2.15.0"
coil = "3.5.0"
vico = "1.15.0"
bouncycastle = "1.87"
espresso = "3.6.1"


[libraries]
test-workmanager = { module = "androidx.work:work-testing", version.ref = "workmanager" }
test-junit = { module = "junit:junit", version = "4.13.2" }
test-mockk = { module = "io.mockk:mockk", version = "1.13.13" }
test-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
test-robolectric = { module = "org.robolectric:robolectric", version = "4.18.1" }
test-androidx-core = { module = "androidx.test:core", version = "1.6.1" }
test-androidx-runner = { module = "androidx.test:runner", version = "1.6.2" }
test-androidx-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
test-compose-junit = { module = "androidx.compose.ui:ui-test-junit4" }
test-compose-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
test-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
test-espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "espresso" }
test-pdfbox = { module = "org.apache.pdfbox:pdfbox", version = "3.0.8" }

androidx-core-ktx             = { group = "androidx.core",            name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime    = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",        version.ref = "lifecycle" }
androidx-lifecycle-viewmodel  = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
androidx-activity-compose     = { group = "androidx.activity",        name = "activity-compose",             version.ref = "activityCompose" }
androidx-datastore            = { group = "androidx.datastore",       name = "datastore-preferences",        version.ref = "datastore" }
compose-bom                   = { group = "androidx.compose",         name = "compose-bom",                  version.ref = "composeBom" }
compose-ui                    = { group = "androidx.compose.ui",      name = "ui" }
compose-ui-graphics           = { group = "androidx.compose.ui",      name = "ui-graphics" }
compose-ui-tooling-preview    = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
compose-material3             = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons        = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling            = { group = "androidx.compose.ui",      name = "ui-tooling" }
navigation-compose            = { group = "androidx.navigation",       name = "navigation-compose",           version.ref = "navigationCompose" }
room-runtime                  = { group = "androidx.room",             name = "room-runtime",                 version.ref = "room" }
room-ktx                      = { group = "androidx.room",             name = "room-ktx",                     version.ref = "room" }
room-compiler                 = { group = "androidx.room",             name = "room-compiler",                version.ref = "room" }
koin-android                  = { group = "io.insert-koin",            name = "koin-android",                 version.ref = "koin" }
koin-compose                  = { group = "io.insert-koin",            name = "koin-androidx-compose",        version.ref = "koinCompose" }
coroutines-android            = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",   version.ref = "coroutines" }
coroutines-play               = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
firebase-bom                  = { group = "com.google.firebase",       name = "firebase-bom",                 version.ref = "firebaseBom" }
firebase-crashlytics          = { group = "com.google.firebase",       name = "firebase-crashlytics" }
firebase-analytics            = { group = "com.google.firebase",       name = "firebase-analytics" }
firebase-database             = { group = "com.google.firebase",       name = "firebase-database" }
firebase-auth                 = { group = "com.google.firebase",       name = "firebase-auth" }
firebase-firestore            = { group = "com.google.firebase",       name = "firebase-firestore" }
firebase-messaging            = { group = "com.google.firebase",       name = "firebase-messaging" }
firebase-config               = { group = "com.google.firebase",       name = "firebase-config" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
koin-workmanager      = { group = "io.insert-koin", name = "koin-androidx-workmanager", version.ref = "koin" }
mlkit-barcode         = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkit-barcode" }
camerax-core          = { group = "androidx.camera", name = "camera-core", version.ref = "camera2" }
camerax-camera2       = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera2" }
camerax-lifecycle     = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera2" }
camerax-view          = { group = "androidx.camera", name = "camera-view", version.ref = "camera2" }
okhttp3 = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

[plugins]
android-application   = { id = "com.android.application", version.ref = "agp" }
android-library       = { id = "com.android.library",     version.ref = "agp" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                   = { id = "com.google.devtools.ksp",  version.ref = "ksp" }
google-services       = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics  = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
