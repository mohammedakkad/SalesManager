name: Build Admin Release APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    # This audit branch must use offline, unsigned Seller QA only.
    if: github.ref != 'refs/heads/codex/seller-full-coverage-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Add google-services.json
        run: echo "${{ secrets.ADMIN_GOOGLE_SERVICES_JSON }}" | base64 --decode > admin/google-services.json

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :admin:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: admin-apk
          path: admin/build/outputs/apk/release/admin-release.apk

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin/build/outputs/apk/release/admin-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
