name: Seller QA
on:
  pull_request:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Install verified Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp/qa-gradle
          echo /tmp/qa-gradle/gradle-8.9/bin >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: seller-qa-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Generate offline packaging fixture (never production Firebase)
        run: python3 scripts/generate-offline-firebase.py
      - name: Test, coverage, lint and debug assembly
        run: |
          python3 scripts/check-seller-secrets.py
          scripts/qa-seller.sh
          python3 scripts/report-seller-coverage.py --check
      - name: Build minified unsigned QA release (not distributable)
        run: gradle --configure-on-demand --no-configuration-cache --no-daemon --max-workers=4 :salesmanager:assembleRelease -x :salesmanager:uploadCrashlyticsMappingFileRelease
      - name: Preserve reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-qa-reports
          path: |
            app/build/reports/
            app/build/test-results/
            salesmanager/build/reports/
            salesmanager/build/test-results/

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install verified Gradle and platform
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp/qa-gradle
          echo /tmp/qa-gradle/gradle-8.9/bin >> "$GITHUB_PATH"
          python3 scripts/generate-offline-firebase.py
      - name: Enable hosted-runner KVM access
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -e
            gradle --configure-on-demand --no-configuration-cache --no-daemon --max-workers=2 :salesmanager:connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.trader.salesmanager.debug/files/qa-pdf /tmp/seller-qa-pdf
            gradle -p qa/pdf-verifier --no-daemon -PpdfFixtureDir=/tmp/seller-qa-pdf test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seller-compose-results
          path: |
            salesmanager/build/reports/androidTests/
            salesmanager/build/outputs/androidTest-results/
            qa/pdf-verifier/build/reports/
            qa/pdf-verifier/build/test-results/
