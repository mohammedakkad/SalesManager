name: Seller QA
on:
  pull_request:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision verified isolated Android SDK
        env:
          SELLER_QA_SDK_ROOT: ${{ runner.temp }}/seller-android-sdk
        run: |
          set -o pipefail
          scripts/setup-seller-android.sh 2>&1 | tee "$RUNNER_TEMP/seller-sdk-setup.log"
      - name: Install verified Gradle
        run: |
          set -o pipefail
          scripts/setup-seller-gradle.sh 2>&1 | tee "$RUNNER_TEMP/seller-gradle-setup.log"
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: seller-qa-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Generate offline packaging fixture (never production Firebase)
        run: python3 scripts/generate-offline-firebase.py
      - name: Test, coverage, lint and debug assembly
        run: |
          python3 scripts/check-seller-secrets.py
          python3 -B -m unittest discover -s scripts/tests -p 'test_*coverage*.py' -v
          scripts/qa-seller.sh
          python3 scripts/report-seller-coverage.py --check
      - name: Build minified unsigned QA release (not distributable)
        run: gradle --configure-on-demand --no-configuration-cache --no-daemon --max-workers=4 :salesmanager:assembleRelease -x :salesmanager:uploadCrashlyticsMappingFileRelease
      - name: Preserve reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-qa-reports
          path: |
            ${{ runner.temp }}/seller-sdk-setup.log
            ${{ runner.temp }}/seller-gradle-setup.log
            app/build/reports/
            app/build/test-results/
            salesmanager/build/reports/
            salesmanager/build/test-results/

  compose:
    name: compose (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 28, 33, 35]
    env:
      SELLER_QA_ANDROID_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision verified isolated Android SDK
        env:
          SELLER_QA_SDK_ROOT: ${{ runner.temp }}/seller-android-sdk
        run: |
          set -o pipefail
          scripts/setup-seller-android.sh 2>&1 | tee "$RUNNER_TEMP/seller-sdk-setup.log"
      - name: Install verified Gradle
        run: |
          set -o pipefail
          scripts/setup-seller-gradle.sh 2>&1 | tee "$RUNNER_TEMP/seller-gradle-setup.log"
          python3 scripts/generate-offline-firebase.py
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: seller-qa-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Enable hosted-runner KVM access
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run-seller-device-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seller-compose-results-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/seller-sdk-setup.log
            ${{ runner.temp }}/seller-gradle-setup.log
            salesmanager/build/reports/androidTests/
            salesmanager/build/outputs/androidTest-results/
            /tmp/seller-qa-pdf/
            /tmp/seller-qa-pdf-recovery/
            qa/pdf-verifier/build/reports/
            qa/pdf-verifier/build/test-results/
            app/build/reports/jacoco/
            salesmanager/build/reports/jacoco/
            salesmanager/build/outputs/code_coverage/
            /tmp/seller-qa-combined-coverage.log
            /tmp/seller-qa-combined-counts.json
            /tmp/seller-qa-device-test-summary.json
            /tmp/seller-qa-instrumentation.log
